name: goreleaser

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  actions: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Run build
        run: go build -v ./...

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}

  update-nix:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GORELEASER_GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v27

      - name: Compute archive hashes and update nix/gorefact.nix
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BASE="https://github.com/flaticols/gorefactor/releases/download/${TAG}"

          ARM_URL="${BASE}/gorefact_Darwin_arm64.tar.gz"
          X86_URL="${BASE}/gorefact_Darwin_x86_64.tar.gz"

          ARM_HASH=$(nix-prefetch-url "$ARM_URL" 2>/dev/null | tail -1 | xargs -I{} nix hash convert --hash-algo sha256 --from nix32 {})
          X86_HASH=$(nix-prefetch-url "$X86_URL" 2>/dev/null | tail -1 | xargs -I{} nix hash convert --hash-algo sha256 --from nix32 {})

          sed -i \
            -e "s|version = \"[^\"]*\"|version = \"${VERSION}\"|" \
            -e "s|hash = \"sha256-[^\"]*\"; # arm|hash = \"${ARM_HASH}\"; # arm|" \
            -e "s|hash = \"sha256-[^\"]*\"; # x86|hash = \"${X86_HASH}\"; # x86|" \
            nix/gorefact.nix

      - name: Commit updated nix/gorefact.nix
        run: |
          git config user.name "Denis Panfilov"
          git config user.email "gh@flaticols.dev"
          git add nix/gorefact.nix
          git diff --cached --quiet || git commit -m "nix: update gorefact to ${{ github.ref_name }}"
          git push
